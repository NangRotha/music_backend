services:
  - type: web
    name: music-backend
    runtime: docker
    dockerfilePath: Dockerfile
    # NOTE: Render Persistent Disks require a paid instance type (Starter or
    # higher). Free instances cannot mount disks. Change plan here only if you
    # accept the monthly cost for persistence.
    plan: starter
    region: singapore
    healthCheckPath: /health
    # Persistent volume – the SQLite DB + local uploads survive every deploy.
    disk:
      name: music-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:////var/data/music_store.db
      - key: RENDER_DISK_PATH
        value: /var/data
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        value: admin123
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOADTHING_TOKEN
        sync: false
      - key: UPLOADTHING_SECRET
        sync: false
      - key: UPLOADTHING_APP_ID
        sync: false
      - key: KHQRCC_PROFILE_ID
        sync: false
      - key: KHQRCC_SECRET_KEY
        sync: false
      - key: KHQRCC_GATEWAY_URL
        value: "https://khqr.cc"
